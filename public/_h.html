<!doctype html><meta charset="utf-8"><title>harness</title>
<style>html,body{margin:0;background:#111;overflow:hidden}
iframe{border:0;display:block;width:1440px;zoom:var(--z)}</style>
<iframe id="f" src="/"></iframe>
<script>
const P=new URLSearchParams(location.search);
const W=+(P.get('w')||1440), H=+(P.get('h')||1010);
const f=document.getElementById('f');
f.style.width=W+'px'; f.style.height=H+'px';
document.documentElement.style.setProperty('--z', (innerWidth/W).toFixed(4));
</script>
