<!DOCTYPE html>
<html lang="en" data-theme="light" data-auto-theming="false">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light" />
    <title>Simplex Aluminium — photo admin</title>
    <link rel="icon" href="logo.png" />
    <style>
      /* The admin is always light. The mark is black line art, so Sveltia's
         dark theme would put a black logo on a black background. The html
         attributes above are honoured by Sveltia's app shell; the script
         below seeds the same choice into its saved preferences. */
      html, body {
        background: #fff;
        color: #1f201e;
      }
      /* Splash shown while the Sveltia script downloads and boots. Plain HTML
         so it paints before any JavaScript runs; removed once Sveltia has
         drawn its own screen (sign-in page or the app). */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: #fff;
        color: #1f201e;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        transition: opacity 0.35s ease;
      }
      #splash.is-done {
        opacity: 0;
        pointer-events: none;
      }
      #splash img {
        width: min(50vw, 200px);
        height: auto;
        animation: splash-pulse 1.6s ease-in-out infinite;
      }
      #splash p {
        margin: 0;
        font-size: 0.875rem;
        letter-spacing: 0.04em;
        opacity: 0.6;
      }
      @keyframes splash-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img { animation: none; }
        #splash { transition: none; }
      }
    </style>
    <script>
      // Sveltia stores the theme choice in localStorage and, when it is
      // "auto" or unset, follows the OS dark mode. Default it to light so the
      // first visit is white; a theme picked later in Settings still wins.
      (function () {
        var key = "sveltia-cms.prefs";
        try {
          var prefs = JSON.parse(localStorage.getItem(key) || "{}") || {};
          if (!prefs.theme || prefs.theme === "auto") {
            prefs.theme = "light";
            localStorage.setItem(key, JSON.stringify(prefs));
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite">
      <img src="logo.png" alt="" width="512" height="512" />
      <p>Loading photo admin…</p>
    </div>

    <!-- Sveltia CMS: Git-based admin, saves straight to the GitHub repo. Config in config.yml next to this file. -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    <script>
      (function () {
        var splash = document.getElementById("splash");
        if (!splash) return;

        function done() {
          if (splash.classList.contains("is-done")) return;
          splash.classList.add("is-done");
          setTimeout(function () { splash.remove(); }, 400);
          observer.disconnect();
        }

        // Sveltia mounts an empty shell first, then fetches config.yml and
        // draws the sign-in page or the app. Wait for something interactive
        // (a button or heading) outside the splash before fading it out, so
        // Sveltia's own loading state never shows through.
        function ready() {
          var els = document.body.querySelectorAll("button, h1, h2, [role=\"main\"]");
          for (var i = 0; i < els.length; i++) {
            if (!splash.contains(els[i])) return true;
          }
          return false;
        }

        var observer = new MutationObserver(function () {
          if (ready()) done();
        });
        observer.observe(document.body, { childList: true, subtree: true });
        if (ready()) done();

        // Safety nets: never leave the splash stuck over a broken or slow load.
        var cms = document.querySelector('script[src*="sveltia-cms"]');
        if (cms) cms.addEventListener("error", done);
        setTimeout(done, 15000);
      })();
    </script>
  </body>
</html>
